name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
      - name: Unit tests (no Postgres)
        working-directory: .
        env:
          PYTHONPATH: backend
        run: |
          pytest -q --noconftest \
            tests/test_dedupe.py \
            tests/test_scoring.py \
            backend/tests/test_website_intelligence.py \
            tests/test_esp_unsubscribe.py \
            tests/test_plan_limits.py \
            tests/test_logging.py \
            tests/test_ssrf.py \
            tests/test_prompt_injection.py \
            tests/test_multi_tenant_isolation.py \
            tests/test_celery_retry.py \
            tests/test_followup_template.py \
            tests/test_billing_plan_status.py \
            tests/test_dns_verify.py

  # Optional full suite when secrets/services are available
  # integration:
  #   runs-on: ubuntu-latest
  #   services:
  #     postgres: ...
