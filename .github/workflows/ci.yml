name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Unit tests (no Postgres)
        env:
          PYTHONPATH: backend
          APP_SECRET_KEY: ci-test-secret
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
        run: |
          pytest -q --noconftest \
            tests/test_dedupe.py \
            tests/test_scoring.py \
            tests/test_lead_quota_enforcement.py \
            tests/test_discovery_cancellation.py \
            backend/tests/test_website_intelligence.py \
            backend/tests/test_lead_api_data_flow.py \
            tests/test_esp_unsubscribe.py \
            tests/test_plan_limits.py \
            tests/test_logging.py \
            tests/test_ssrf.py \
            tests/test_prompt_injection.py \
            tests/test_multi_tenant_isolation.py \
            tests/test_celery_retry.py \
            tests/test_followup_template.py \
            tests/test_billing_plan_status.py \
            tests/test_dns_verify.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_finder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auto_finder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: PostgreSQL integration tests
        env:
          PYTHONPATH: backend
          APP_ENV: test
          APP_SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/auto_finder_test
          DATABASE_URL_TEST: postgresql+asyncpg://postgres:postgres@localhost:5432/auto_finder_test
        run: |
          pytest -q tests/test_postgres_lead_quota_concurrency.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build
