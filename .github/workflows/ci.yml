name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Unit tests (no Postgres)
        env:
          PYTHONPATH: backend
          APP_SECRET_KEY: ci-test-secret
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
        run: |
          pytest -q --noconftest \
            tests/test_dedupe.py \
            tests/test_scoring.py \
            tests/test_lead_quota_enforcement.py \
            tests/test_discovery_cancellation.py \
            backend/tests/test_website_intelligence.py \
            backend/tests/test_lead_api_data_flow.py \
            tests/test_esp_unsubscribe.py \
            tests/test_plan_limits.py \
            tests/test_logging.py \
            tests/test_ssrf.py \
            tests/test_prompt_injection.py \
            tests/test_multi_tenant_isolation.py \
            tests/test_celery_retry.py \
            tests/test_followup_template.py \
            tests/test_billing_plan_status.py \
            tests/test_dns_verify.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build

  # Optional full integration suite when external services are available.
  # Add Postgres/Redis service containers here before enabling.
